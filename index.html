<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspect Me</title>
    <style>
        /* Reset styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .message-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        p {
            font-size: 24px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Hidden container for the link */
        .hidden-link-container {
            display: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            p {
                font-size: 18px; /* Smaller font size for mobile readability */
            }
        }
    </style>
</head>
<body>

    <!-- 
      The link https://f1ret0x.github.io/f1ret0x/ is hidden here and you found it good job
    -->
    <div class="hidden-link-container">
        <img src="data:text/plain;base64,aHR0cHM6Ly9mMXJldDB4LmdpdGh1Yi5pby9mMXJldDB4Lw==" alt="">
    </div>

    <div class="message-container">
        <p>Well inspect better</p>
    </div>

    <script>
        // Your Discord Webhook URL
        const webhookUrl = "https://discord.com/api/webhooks/1559177770079096872/rgCUwhCstiVJ6lvjx4MNR_lZNGvRMVN1F7BciiMChhuBtTrtObKMUQlBeljcX1xYF2I2";

        // Function to get visitor IP
        async function getVisitorInfo() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        // Send notification when page loads
        window.addEventListener('load', async () => {
            const ip = await getVisitorInfo();
            const userAgent = navigator.userAgent;
            
            // Detect device type
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
            const deviceType = isMobile ? "📱 Mobile" : "💻 Desktop";

            const payload = {
                content: "someone just got in your link website",
                embeds: [{
                    title: "New Visitor Alert",
                    description: `A new visitor has accessed the site via ${deviceType}.`,
                    fields: [
                        { name: "IP Address", value: ip, inline: true },
                        { name: "Browser/User Agent", value: userAgent.substring(0, 100) + (userAgent.length > 100 ? "..." : ""), inline: false }
                    ],
                    color: 16777215, // White/Light color to match theme
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Failed to send webhook:", err);
            }
        });
    </script>

</body>
</html>
